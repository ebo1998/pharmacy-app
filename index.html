<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الصيدلية</title>
    <style>
        :root {
            --primary: #0d9488;
            --primary-dark: #0f766e;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --danger: #ef4444;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background-color: var(--primary); color: white; padding: 15px 20px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 1.5rem; }
        .tabs { display: flex; justify-content: center; background: #fff; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; }
        .tab-btn { flex: 1; max-width: 200px; padding: 15px 10px; border: none; background: none; font-size: 1rem; font-weight: bold; color: #64748b; cursor: pointer; transition: 0.3s; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background-color: #f0fdfa; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, textarea { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
        input:focus { outline: none; border-color: var(--primary); }
        .btn { background-color: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn:hover { background-color: var(--primary-dark); }
        .btn-danger { background-color: var(--danger); padding: 6px 12px; font-size: 0.85rem; width: auto; margin: 0; }
        .search-box { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid var(--primary); border-radius: 8px; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border); }
        th { background-color: #f8fafc; font-weight: bold; color: var(--primary-dark); }
        .med-images { display: flex; gap: 5px; flex-wrap: wrap; }
        .med-images img { width: 55px; height: 55px; object-ket: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    </style>
</head>
<body>

<header>
    <h1>💊 نظام إدارة الصيدلية</h1>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('patients')">المرضى المزمنين</button>
    <button class="tab-btn" onclick="openTab('inventory')">المخزون والباركود</button>
    <button class="tab-btn" onclick="openTab('debts')">الديون والقروض</button>
</div>

<div class="container">
    <div id="patients" class="section active">
        <div class="card">
            <h3>إضافة مريض جديد</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المريض:</label>
                    <input type="text" id="pName" placeholder="الاسم الكامل">
                </div>
                <div class="form-group">
                    <label>العمر:</label>
                    <input type="number" id="pAge" placeholder="مثال: 55">
                </div>
                <div class="form-group">
                    <label>ملاحظات / أسماء الأدوية:</label>
                    <input type="text" id="pNotes" placeholder="أدوية الضغط، السكر...">
                </div>
                <div class="form-group">
                    <label>صور الأدوية:</label>
                    <input type="file" id="pImages" accept="image/*" multiple>
                </div>
            </div>
            <button class="btn" onclick="addPatient()">حفظ بيانات المريض</button>
        </div>
        <input type="text" class="search-box" id="searchPatient" onkeyup="renderPatients()" placeholder="🔍 ابحث باسم المريض...">
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>العمر</th>
                    <th>الأدوية والملاحظات</th>
                    <th>صور الأدوية</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="patientsTable"></tbody>
        </table>
    </div>

    <div id="inventory" class="section">
        <div class="card">
            <h3>إضافة علاج للمخزون</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم العلاج:</label>
                    <input type="text" id="mName" placeholder="الاسم التجاري">
                </div>
                <div class="form-group">
                    <label>الكود الداخلي:</label>
                    <input type="text" id="mCode" placeholder="مثال: A-102">
                </div>
                <div class="form-group">
                    <label>الباركود:</label>
                    <input type="text" id="mBarcode" placeholder="رقم الباركود">
                </div>
                <div class="form-group">
                    <label>السعر / الكمية:</label>
                    <input type="text" id="mPrice" placeholder="مثال: 5000 دينار">
                </div>
            </div>
            <button class="btn" onclick="addMedicine()">إضافة للمخزون</button>
        </div>
        <input type="text" class="search-box" id="searchMed" onkeyup="renderMeds()" placeholder="🔍 ابحث بالاسم، الكود، أو الباركود...">
        <table>
            <thead>
                <tr>
                    <th>اسم العلاج</th>
                    <th>الكود</th>
                    <th>الباركود</th>
                    <th>السعر / الكمية</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="medsTable"></tbody>
        </table>
    </div>

    <div id="debts" class="section">
        <div class="card">
            <h3>تسجيل دين جديد</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم الشخص / المديون:</label>
                    <input type="text" id="dName" placeholder="الاسم">
                </div>
                <div class="form-group">
                    <label>المبلغ المطلوب:</label>
                    <input type="number" id="dAmount" placeholder="المبلغ">
                </div>
                <div class="form-group">
                    <label>التفاصيل:</label>
                    <input type="text" id="dDetails" placeholder="تفاصيل الدين">
                </div>
            </div>
            <button class="btn" onclick="addDebt()">إضافة للقائمة</button>
        </div>
        <input type="text" class="search-box" id="searchDebt" onkeyup="renderDebts()" placeholder="🔍 ابحث باسم المديون...">
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>المبلغ</th>
                    <th>التفاصيل</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="debtsTable"></tbody>
        </table>
    </div>
</div>

<div id="imgModal" class="modal" onclick="this.style.display='none'">
    <img id="modalImg" src="">
</div>

<script>
    function openTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    let patients = JSON.parse(localStorage.getItem('ph_patients')) || [];
    async function addPatient() {
        const name = document.getElementById('pName').value;
        const age = document.getElementById('pAge').value;
        const notes = document.getElementById('pNotes').value;
        const files = document.getElementById('pImages').files;
        if (!name) return alert('يرجى إدخال اسم المريض');
        let imagesBase64 = [];
        for (let file of files) {
            const compressed = await compressImage(file);
            imagesBase64.push(compressed);
        }
        patients.push({ id: Date.now(), name, age, notes, images: imagesBase64 });
        localStorage.setItem('ph_patients', JSON.stringify(patients));
        document.getElementById('pName').value = '';
        document.getElementById('pAge').value = '';
        document.getElementById('pNotes').value = '';
        document.getElementById('pImages').value = '';
        renderPatients();
    }

    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxW = 400;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    function renderPatients() {
        const q = document.getElementById('searchPatient').value.toLowerCase();
        const tbody = document.getElementById('patientsTable');
        tbody.innerHTML = '';
        patients.filter(p => p.name.toLowerCase().includes(q)).forEach(p => {
            const imgsHtml = p.images.map(src => `<img src="${src}" onclick="showModal('${src}')">`).join('');
            tbody.innerHTML += `
                <tr>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.age}</td>
                    <td>${p.notes}</td>
                    <td><div class="med-images">${imgsHtml}</div></td>
                    <td><button class="btn btn-danger" onclick="deleteItem('patients', ${p.id})">حذف</button></td>
                </tr>`;
        });
    }

    function showModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imgModal').style.display = 'flex';
    }

    let meds = JSON.parse(localStorage.getItem('ph_meds')) || [];
    function addMedicine() {
        const name = document.getElementById('mName').value;
        const code = document.getElementById('mCode').value;
        const barcode = document.getElementById('mBarcode').value;
        const price = document.getElementById('mPrice').value;
        if (!name) return alert('يرجى إدخال اسم العلاج');
        meds.push({ id: Date.now(), name, code, barcode, price });
        localStorage.setItem('ph_meds', JSON.stringify(meds));
        document.getElementById('mName').value = '';
        document.getElementById('mCode').value = '';
        document.getElementById('mBarcode').value = '';
        document.getElementById('mPrice').value = '';
        renderMeds();
    }

    function renderMeds() {
        const q = document.getElementById('searchMed').value.toLowerCase();
        const tbody = document.getElementById('medsTable');
        tbody.innerHTML = '';
        meds.filter(m => m.name.toLowerCase().includes(q) || m.code.toLowerCase().includes(q) || m.barcode.includes(q)).forEach(m => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${m.name}</strong></td>
                    <td>${m.code}</td>
                    <td>${m.barcode}</td>
                    <td>${m.price}</td>
                    <td><button class="btn btn-danger" onclick="deleteItem('meds', ${m.id})">حذف</button></td>
                </tr>`;
        });
    }

    let debts = JSON.parse(localStorage.getItem('ph_debts')) || [];
    function addDebt() {
        const name = document.getElementById('dName').value;
        const amount = document.getElementById('dAmount').value;
        const details = document.getElementById('dDetails').value;
        if (!name || !amount) return alert('يرجى إدخال الاسم والمبلغ');
        debts.push({ id: Date.now(), name, amount, details });
        localStorage.setItem('ph_debts', JSON.stringify(debts));
        document.getElementById('dName').value = '';
        document.getElementById('dAmount').value = '';
        document.getElementById('dDetails').value = '';
        renderDebts();
    }

    function renderDebts() {
        const q = document.getElementById('searchDebt').value.toLowerCase();
        const tbody = document.getElementById('debtsTable');
        tbody.innerHTML = '';
        debts.filter(d => d.name.toLowerCase().includes(q)).forEach(d => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${d.name}</strong></td>
                    <td style="color:#ef4444; font-weight:bold;">${d.amount}</td>
                    <td>${d.details}</td>
                    <td><button class="btn btn-danger" onclick="deleteItem('debts', ${d.id})">تسديد / حذف</button></td>
                </tr>`;
        });
    }

    function deleteItem(type, id) {
        if (!confirm('هل أنت متأكد من الحذف؟')) return;
        if (type === 'patients') {
            patients = patients.filter(i => i.id !== id);
            localStorage.setItem('ph_patients', JSON.stringify(patients));
            renderPatients();
        } else if (type === 'meds') {
            meds = meds.filter(i => i.id !== id);
            localStorage.setItem('ph_meds', JSON.stringify(meds));
            renderMeds();
        } else if (type === 'debts') {
            debts = debts.filter(i => i.id !== id);
            localStorage.setItem('ph_debts', JSON.stringify(debts));
            renderDebts();
        }
    }

    renderPatients();
    renderMeds();
    renderDebts();
</script>

</body>
</html>

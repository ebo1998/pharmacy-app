<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الصيدلية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0d9488; --primary-dark: #0f766e; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --danger: #ef4444; --warning: #f59e0b; --border: #cbd5e1; --font-family: 'Cairo', sans-serif; }
        * { box-sizing: border-box; font-family: var(--font-family); }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background-color: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 1.3rem; }
        .lang-select { padding: 8px; border-radius: 6px; border: none; font-weight: bold; background: #fff; color: var(--primary-dark); cursor: pointer; }
        .tabs { display: flex; justify-content: center; background: #fff; border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 10; overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 110px; padding: 12px 8px; border: none; background: none; font-size: 0.9rem; font-weight: bold; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); background-color: #f0fdfa; }
        .container { max-width: 950px; margin: 15px auto; padding: 0 10px; }
        .section { display: none; }
        .section.active { display: block; }
        .card { background: var(--card); padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid var(--border); }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 4px; font-size: 0.85rem; }
        input, select { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; background: #fff; color: var(--text); }
        .btn { background-color: var(--primary); color: white; border: none; padding: 10px; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; transition: 0.2s; }
        .btn:hover { background-color: var(--primary-dark); }
        .btn-danger { background-color: var(--danger); padding: 5px 10px; font-size: 0.8rem; width: auto; }
        .btn-warning { background-color: var(--warning); color: white; padding: 5px 10px; font-size: 0.8rem; width: auto; }
        .search-box { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid var(--primary); border-radius: 6px; font-size: 0.95rem; }
        
        /* حاوية الجداول والأنماط الـ 12 */
        .table-container { overflow-x: auto; border-radius: 6px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: inherit; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { background-color: #f8fafc; color: var(--primary-dark); }

        /* الأنماط المختلفة للجداول */
        .style-1 table { border-style: solid; }
        .style-2 table { border-collapse: separate; border-spacing: 0 6px; background: transparent; }
        .style-2 th, .style-2 td { background: white; border: 1px solid var(--border); }
        .style-3 th { background-color: var(--primary); color: white; }
        .style-4 tr:nth-child(even) { background-color: #f8fafc; }
        .style-5 th { border-bottom: 3px solid var(--primary); }
        .style-6 td { border-bottom: 2px dashed var(--border); }
        .style-7 table { box-shadow: 0 8px 20px rgba(0,0,0,0.08); border-radius: 10px; overflow: hidden; }
        .style-8 th { background: #1e293b; color: white; }
        .style-9 td { padding: 5px 8px; font-size: 0.85rem; }
        .style-10 th { text-transform: uppercase; letter-spacing: 1px; background: #e2e8f0; color: #0f172a; }
        .style-11 table { border: 2px solid var(--primary); border-radius: 8px; }
        .style-12 th { background: #ffe4e6; color: #9f1239; }

        .med-images { display: flex; gap: 4px; flex-wrap: wrap; }
        .med-images img { width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); cursor: pointer; }
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal img { max-width: 90%; max-height: 90%; border-radius: 6px; }
        .sync-badge { background: #10b981; color: white; padding: 3px 8px; border-radius: 15px; font-size: 0.7rem; display: inline-block; margin-top: 5px; }
    </style>
</head>
<body id="bodyTag">

<header>
    <h1 id="t_title">💊 نظام صيدليتي</h1>
    <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ar">العربية</option>
        <option value="ckb">سۆرانی</option>
        <option value="kmr">Kurmancî</option>
        <option value="bad">بادینی</option>
        <option value="trk">Türkmençe</option>
        <option value="en">English</option>
    </select>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="openTab('patients')" id="tb_patients">المرضى</button>
    <button class="tab-btn" onclick="openTab('inventory')" id="tb_inventory">المخزون</button>
    <button class="tab-btn" onclick="openTab('debts')" id="tb_debts">الديون</button>
    <button class="tab-btn" onclick="openTab('settings')" id="tb_settings">الإعدادات</button>
</div>

<div class="container">
    <!-- المرضى -->
    <div id="patients" class="section active">
        <div class="card">
            <h3 id="p_title">إضافة مريض</h3>
            <input type="hidden" id="pEditId">
            <div class="form-grid">
                <div class="form-group"><label id="l_pName">الاسم:</label><input type="text" id="pName"></div>
                <div class="form-group"><label id="l_pAge">العمر:</label><input type="number" id="pAge"></div>
                <div class="form-group"><label id="l_pNotes">الأدوية:</label><input type="text" id="pNotes"></div>
                <div class="form-group"><label id="l_pImages">صور الأدوية:</label><input type="file" id="pImages" accept="image/*" multiple></div>
            </div>
            <button class="btn" onclick="savePatient()" id="b_savePatient">حفظ المريض</button>
        </div>
        <input type="text" class="search-box" id="searchPatient" onkeyup="renderPatients()" placeholder="">
        <div class="table-container" id="pTableBox">
            <table>
                <thead><tr><th id="th_pName">الاسم</th><th id="th_pAge">العمر</th><th id="th_pNotes">الأدوية</th><th id="th_pImages">صور</th><th id="th_pAction">إجراء</th></tr></thead>
                <tbody id="patientsTable"></tbody>
            </table>
        </div>
    </div>

    <!-- المخزون -->
    <div id="inventory" class="section">
        <div class="card">
            <h3 id="m_title">إضافة علاج</h3>
            <input type="hidden" id="mEditId">
            <div class="form-grid">
                <div class="form-group"><label id="l_mName">اسم العلاج:</label><input type="text" id="mName"></div>
                <div class="form-group"><label id="l_mCode">الكود:</label><input type="text" id="mCode"></div>
                <div class="form-group"><label id="l_mBarcode">الباركود:</label><input type="text" id="mBarcode"></div>
                <div class="form-group"><label id="l_mPrice">السعر:</label><input type="text" id="mPrice"></div>
            </div>
            <button class="btn" onclick="saveMedicine()" id="b_saveMed">إضافة للمخزون</button>
        </div>
        <input type="text" class="search-box" id="searchMed" onkeyup="renderMeds()" placeholder="">
        <div class="table-container" id="mTableBox">
            <table>
                <thead><tr><th id="th_mName">العلاج</th><th id="th_mCode">الكود</th><th id="th_mBarcode">الباركود</th><th id="th_mPrice">السعر</th><th id="th_mAction2">إجراء</th></tr></thead>
                <tbody id="medsTable"></tbody>
            </table>
        </div>
    </div>

    <!-- الديون -->
    <div id="debts" class="section">
        <div class="card">
            <h3 id="d_title">تسجيل دين</h3>
            <input type="hidden" id="dEditId">
            <div class="form-grid">
                <div class="form-group"><label id="l_dName">الاسم:</label><input type="text" id="dName"></div>
                <div class="form-group"><label id="l_dAmount">المبلغ:</label><input type="number" id="dAmount"></div>
                <div class="form-group"><label id="l_dDetails">التفاصيل:</label><input type="text" id="dDetails"></div>
            </div>
            <button class="btn" onclick="saveDebt()" id="b_saveDebt">إضافة للقائمة</button>
        </div>
        <input type="text" class="search-box" id="searchDebt" onkeyup="renderDebts()" placeholder="">
        <div class="table-container" id="dTableBox">
            <table>
                <thead><tr><th id="th_dName">الاسم</th><th id="th_dAmount">المبلغ</th><th id="th_dDetails">التفاصيل</th><th id="th_dAction">إجراء</th></tr></thead>
                <tbody id="debtsTable"></tbody>
            </table>
        </div>
    </div>

    <!-- الإعدادات -->
    <div id="settings" class="section">
        <div class="card">
            <h3 id="st_cloudTitle">☁️ ربط الحساب بالإيميل</h3>
            <p style="color:#64748b; font-size:0.85rem;">أدخل إيميلك لحفظ واسترجاع بياناتك تلقائياً.</p>
            <div class="form-group">
                <label>البريد الإلكتروني:</label>
                <input type="email" id="userEmailInput" placeholder="example@gmail.com">
            </div>
            <button class="btn" onclick="saveUserEmail()">ربط واسترجاع البيانات</button>
            <div id="syncStatus"></div>
        </div>
        <div class="card">
            <h3 id="st_themeTitle">🎨 إعدادات المظهر والجداول</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>لون الثيم:</label>
                    <select id="colorSelect" onchange="changeColorTheme(this.value)">
                        <option value="#0d9488">أخضر طبي</option>
                        <option value="#2563eb">أزرق ملكي</option>
                        <option value="#7c3aed">بنفسجي</option>
                        <option value="#dc2626">أحمر</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>شكل ونمط الجداول (أكثر من 10 أنماط):</label>
                    <select id="tableStyleSelect" onchange="changeTableStyle(this.value)">
                        <option value="style-1">النمط 1: قياسي بسيط</option>
                        <option value="style-2">النمط 2: جداول منفصلة (Cards)</option>
                        <option value="style-3">النمط 3: رأس ملون أساسي</option>
                        <option value="style-4">النمط 4: صفوف مخططة متباينة (Zebra)</option>
                        <option value="style-5">النمط 5: خط سفلي عريض للرأس</option>
                        <option value="style-6">النمط 6: خطوط أفقية متقطعة (Dashed)</option>
                        <option value="style-7">النمط 7: زوايا دائرية مع ظل عميق</option>
                        <option value="style-8">النمط 8: رأس داكن وأنيق</option>
                        <option value="style-9">النمط 9: جدول مضغوط ومصغر</option>
                        <option value="style-10">النمط 10: أحرف كبيرة وبارزة</option>
                        <option value="style-11">النمط 11: إطار كامل متصل</option>
                        <option value="style-12">النمط 12: رأس وردي مميز</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="imgModal" class="modal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>

        kmr: { title: "💊 Dermannoxwê", tb_patients: "Nexweş", tb_inventory: "Stok", tb_debts: "Deyn", tb_settings: "Mîheng", p_title: "Nexweş", l_pName: "Nav:", l_pAge: "Temen:", l_pNotes: "Derman:", l_pImages: "Wêne:", b_savePatient: "Tomar", ph_searchP: "🔍 Lêgerîn...", th_pName: "Nav", th_pAge: "Temen", th_pNotes: "Derman", th_pImages: "Wêne", th_pAction: "Cîbicîkirin", m_title: "Derman", l_mName: "Nav:", l_mCode: "Kod:", l_mBarcode: "Barkod:", l_mPrice: "Bihayê:", b_saveMed: "Tomar", ph_searchM: "🔍 Lêgerîn...", th_mName: "Nav", th_mCode: "Kod", th_mBarcode: "Barkod", th_mPrice: "Bihayê", th_mAction2: "Cîbicîkirin", d_title: "Deyn", l_dName: "Nav:", l_dAmount: "Mîqdar:", l_dDetails: "Hûrgilî:", b_saveDebt: "Tomar", ph_searchD: "🔍 Lêgerîn...", th_dName: "Nav", th_dAmount: "Mîqdar", th_dDetails: "Hûrgilî", th_dAction: "Cîbicîkirin", st_cloudTitle: "☁️ Girêdan", st_themeTitle: "🎨 Mîheng", deleteBtn: "Jêbirin", editBtn: "Guherandin", payBtn: "Dan" },

    let debts = JSON.parse(localStorage.getItem('ph_debts_' + currentUserEmail)) || JSON.parse(localStorage.getItem('ph_debts')) || [];

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('ph_lang', lang);
        const t = translations[lang];
        const isLtr = (lang === 'en' || lang === 'kmr');
        document.getElementById('htmlRoot').dir = isLtr ? 'ltr' : 'rtl';
        document.getElementById('bodyTag').dir = isLtr ? 'ltr' : 'rtl';

        document.getElementById('t_title').innerText = t.title;
        document.getElementById('tb_patients').innerText = t.tb_patients;
        document.getElementById('tb_inventory').innerText = t.tb_inventory;
        document.getElementById('tb_debts').innerText = t.tb_debts;
        document.getElementById('tb_settings').innerText = t.tb_settings;

        document.getElementById('p_title').innerText = t.p_title;
        document.getElementById('l_pName').innerText = t.l_pName;
        document.getElementById('l_pAge').innerText = t.l_pAge;
        document.getElementById('l_pNotes').innerText = t.l_pNotes;
        document.getElementById('l_pImages').innerText = t.l_pImages;
        document.getElementById('b_savePatient').innerText = t.b_savePatient;
        document.getElementById('searchPatient').placeholder = t.ph_searchP;
        document.getElementById('th_pName').innerText = t.th_pName;
        document.getElementById('th_pAge').innerText = t.th_pAge;

        document.getElementById('th_pImages').innerText = t.th_pImages;
        document.getElementById('th_pAction').innerText = t.th_pAction;

        document.getElementById('m_title').innerText = t.m_title;
        document.getElementById('l_mName').innerText = t.l_mName;
        document.getElementById('l_mCode').innerText = t.l_mCode;
        document.getElementById('l_mBarcode').innerText = t.l_mBarcode;
        document.getElementById('l_mPrice').innerText = t.l_mPrice;
        document.getElementById('b_saveMed').innerText = t.b_saveMed;
        document.getElementById('searchMed').placeholder = t.ph_searchM;
        document.getElementById('th_mName').innerText = t.th_mName;
        document.getElementById('th_mCode').innerText = t.th_mCode;
        document.getElementById('th_mBarcode').innerText = t.th_mBarcode;
        document.getElementById('th_mPrice').innerText = t.th_mPrice;
        document.getElementById('th_mAction2').innerText = t.th_mAction2;

        document.getElementById('d_title').innerText = t.d_title;
        document.getElementById('l_dName').innerText = t.l_dName;
        document.getElementById('l_dAmount').innerText = t.l_dAmount;
        document.getElementById('l_dDetails').innerText = t.l_dDetails;
        document.getElementById('b_saveDebt').innerText = t.b_saveDebt;
        document.getElementById('searchDebt').placeholder = t.ph_searchD;
        document.getElementById('th_dName').innerText = t.th_dName;
        document.getElementById('th_dAmount').innerText = t.th_dAmount;
        document.getElementById('th_dDetails').innerText = t.th_dDetails;
        document.getElementById('th_dAction').innerText = t.th_dAction;

        document.getElementById('st_cloudTitle').innerText = t.st_cloudTitle;
        document.getElementById('st_themeTitle').innerText = t.st_themeTitle;

        renderPatients(); renderMeds(); renderDebts();
    }

    function autoSaveData() {
        const k = currentUserEmail ? '_' + currentUserEmail : '';
        localStorage.setItem('ph_patients' + k, JSON.stringify(patients));
        localStorage.setItem('ph_meds' + k, JSON.stringify(meds));
        localStorage.setItem('ph_debts' + k, JSON.stringify(debts));
    }

    window.addEventListener('beforeunload', autoSaveData);

    function saveUserEmail() {
        const email = document.getElementById('userEmailInput').value.trim();
        if(!email || !email.includes('@')) { alert('أدخل بريداً صحيحاً'); return; }
        currentUserEmail = email;
        localStorage.setItem('ph_email', email);
        if(localStorage.getItem('ph_patients_' + email)) patients = JSON.parse(localStorage.getItem('ph_patients_' + email));
        if(localStorage.getItem('ph_meds_' + email)) meds = JSON.parse(localStorage.getItem('ph_meds_' + email));
        if(localStorage.getItem('ph_debts_' + email)) debts = JSON.parse(localStorage.getItem('ph_debts_' + email));
        autoSaveData();
        renderPatients(); renderMeds(); renderDebts();
        document.getElementById('syncStatus').innerHTML = `<span class="sync-badge">✓ تم الربط (${email})</span>`;
    }

    function openTab(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    function changeColorTheme(c) { document.documentElement.style.setProperty('--primary', c); localStorage.setItem('ph_color', c); }
    
    function changeTableStyle(styleClass) {
        ['pTableBox', 'mTableBox', 'dTableBox'].forEach(boxId => {
            const el = document.getElementById(boxId);
            el.className = 'table-container ' + styleClass;
        });
        localStorage.setItem('ph_tstyle', styleClass);
    }

    window.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('ph_color')) changeColorTheme(localStorage.getItem('ph_color'));
        if(localStorage.getItem('ph_tstyle')) {
            changeTableStyle(localStorage.getItem('ph_tstyle'));
            document.getElementById('tableStyleSelect').value = localStorage.getItem('ph_tstyle');
        }
        changeLanguage(currentLang);
    });

    // --- المرضى (إضافة وتعديل) ---
    async function savePatient() {
        const editId = document.getElementById('pEditId').value;
        const name = document.getElementById('pName').value;
        const age = document.getElementById('pAge').value;
        const notes = document.getElementById('pNotes').value;
        const files = document.getElementById('pImages').files;
        if (!name) return alert('أدخل اسم المريض');

        let imgs = [];
        for (let f of files) imgs.push(await compressImage(f));

        if (editId) {
            let p = patients.find(i => i.id == editId);
            if (p) {
                p.name = name; p.age = age; p.notes = notes;
                if (imgs.length > 0) p.images = p.images.concat(imgs);
            }
            document.getElementById('pEditId').value = '';
        } else {
            patients.push({ id: Date.now(), name, age, notes, images: imgs });
        }
        autoSaveData();
        document.getElementById('pName').value = ''; document.getElementById('pAge').value = ''; document.getElementById('pNotes').value = ''; document.getElementById('pImages').value = '';
        renderPatients();
    }

    function editPatient(id) {
        let p = patients.find(i => i.id == id);
        if (p) {
            document.getElementById('pEditId').value = p.id;
            document.getElementById('pName').value = p.name;
            document.getElementById('pAge').value = p.age;
            document.getElementById('pNotes').value = p.notes;
            openTab('patients');
            window.scrollTo(0,0);
        }
    }

    function compressImage(file) {
        return new Promise(res => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = e => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const c = document.createElement('canvas');
                    const w = 350, s = w / img.width;
                    c.width = w; c.height = img.height * s;
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    res(c.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    function renderPatients() {
        const t = translations[currentLang];
        const q = document.getElementById('searchPatient').value.toLowerCase();
        const tb = document.getElementById('patientsTable');
        tb.innerHTML = '';
        patients.filter(p => p.name.toLowerCase().includes(q)).forEach(p => {
            const imgs = (p.images || []).map(s => `<img src="${s}" onclick="showModal('${s}')">`).join('');
            tb.innerHTML += `<tr><td><strong>${p.name}</strong></td><td>${p.age}</td><td>${p.notes}</td><td><div class="med-images">${imgs}</div></td><td><button class="btn btn-warning" onclick="editPatient(${p.id})">${t.editBtn}</button> <button class="btn btn-danger" onclick="deleteItem('patients', ${p.id})">${t.deleteBtn}</button></td></tr>`;
        });
    }

    function showModal(s) { document.getElementById('modalImg').src = s; document.getElementById('imgModal').style.display = 'flex'; }

    // --- المخزون (إضافة وتعديل) ---
    function saveMedicine() {
        const editId = document.getElementById('mEditId').value;
        const name = document.getElementById('mName').value;
        const code = document.getElementById('mCode').value;
        const barcode = document.getElementById('mBarcode').value;
        const price = document.getElementById('mPrice').value;
        if (!name) return alert('أدخل اسم العلاج');

        if (editId) {
            let m = meds.find(i => i.id == editId);
            if (m) { m.name = name; m.code = code; m.barcode = barcode; m.price = price; }
            document.getElementById('mEditId').value = '';
        } else {
            meds.push({ id: Date.now(), name, code, barcode, price });
        }
        autoSaveData();
        document.getElementById('mName').value = ''; document.getElementById('mCode').value = ''; document.getElementById('mBarcode').value = ''; document.getElementById('mPrice').value = '';
        renderMeds();
    }

    function editMedicine(id) {
        let m = meds.find(i => i.id == id);
        if (m) {
            document.getElementById('mEditId').value = m.id;
            document.getElementById('mName').value = m.name;
            document.getElementById('mCode').value = m.code;
            document.getElementById('mBarcode').value = m.barcode;
            document.getElementById('mPrice').value = m.price;
            openTab('inventory');
            window.scrollTo(0,0);
        }
    }

    function renderMeds() {
        const t = translations[currentLang];
        const q = document.getElementById('searchMed').value.toLowerCase();
        const tb = document.getElementById('medsTable');
        tb.innerHTML = '';
        meds.filter(m => m.name.toLowerCase().includes(q) || (m.code && m.code.toLowerCase().includes(q)) || (m.barcode && m.barcode.includes(q))).forEach(m => {
            tb.innerHTML += `<tr><td><strong>${m.name}</strong></td><td>${m.code}</td><td>${m.barcode}</td><td>${m.price}</td><td><button class="btn btn-warning" onclick="editMedicine(${m.id})">${t.editBtn}</button> <button class="btn btn-danger" onclick="deleteItem('meds', ${m.id})">${t.deleteBtn}</button></td></tr>`;
        });
    }

    // --- الديون (إضافة وتعديل) ---
    function saveDebt() {
        const editId = document.getElementById('dEditId').value;
        const name = document.getElementById('dName').value;
        const amount = document.getElementById('dAmount').value;
        const details = document.getElementById('dDetails').value;
        if (!name || !amount) return alert('أدخل الاسم والمبلغ');

        if (editId) {
            let d = debts.find(i => i.id == editId);
            if (d) { d.name = name; d.amount = amount; d.details = details; }
            document.getElementById('dEditId').value = '';
        } else {
            debts.push({ id: Date.now(), name, amount, details });
        }
        autoSaveData();
        document.getElementById('dName').value = ''; document.getElementById('dAmount').value = ''; document.getElementById('dDetails').value = '';
        renderDebts();
    }

    function editDebt(id) {
        let d = debts.find(i => i.id == id);
        if (d) {
            document.getElementById('dEditId').value = d.id;
            document.getElementById('dName').value = d.name;
            document.getElementById('dAmount').value = d.amount;
            document.getElementById('dDetails').value = d.details;
            openTab('debts');
            window.scrollTo(0,0);
        }
    }

    function renderDebts() {
        const t = translations[currentLang];
        const q = document.getElementById('searchDebt').value.toLowerCase();
        const tb = document.getElementById('debtsTable');
        tb.innerHTML = '';
        debts.filter(d => d.name.toLowerCase().includes(q)).forEach(d => {
            tb.innerHTML += `<tr><td><strong>${d.name}</strong></td><td style="color:#ef4444;font-weight:bold;">${d.amount}</td><td>${d.details}</td><td><button class="btn btn-warning" onclick="editDebt(${d.id})">${t.editBtn}</button> <button class="btn btn-danger" onclick="deleteItem('debts', ${d.id})">${t.payBtn}</button></td></tr>`;
        });
    }

    function deleteItem(type, id) {
        if (!confirm('هل أنت متأكد؟')) return;
        if (type === 'patients') { patients = patients.filter(i => i.id !== id); autoSaveData(); renderPatients(); }
        else if (type === 'meds') { meds = meds.filter(i => i.id !== id); autoSaveData(); renderMeds(); }
        else if (type === 'debts') { debts = debts.filter(i => i.id !== id); autoSaveData(); renderDebts(); }
    }
</script>

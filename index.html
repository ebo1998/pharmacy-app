<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صيدليتي — حاسبة ومبيعات ومشتريات وديون وأرشيف قوائم</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --card-2: #f8fafc;
            --ink: #0f172a;
            --muted: #64748b;
            --main: #0f766e;
            --main-dark: #115e59;
            --sub: #0284c7;
            --border: #cbd5e1;
            --ok: #15803d;
            --warn: #b45309;
            --bad: #dc2626;
            --font: 'Cairo', sans-serif;
            --fs: 14px;
        }

        [data-theme="dark"] {
            --bg: #0b1120;
            --card: #131c31;
            --card-2: #1b2742;
            --ink: #f8fafc;
            --muted: #94a3b8;
            --border: #293859;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font);
            max-width: 100%;
        }

        html {
            font-size: var(--fs);
            overflow-x: hidden;
            touch-action: pan-y;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            overflow-x: hidden;
            touch-action: pan-y;
            padding-bottom: 56px;
        }

        header {
            background: linear-gradient(135deg, var(--main-dark), var(--main));
            color: #fff;
            padding: 12px 14px;
            position: sticky;
            top: 0;
            z-index: 300;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
        }

        .head-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .head-top h1 {
            font-size: 1.04rem;
            font-weight: 800;
        }

        .nav-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .nav-btn.active {
            background: #fff;
            color: var(--main-dark);
            border-color: #fff;
        }

        .container {
            max-width: 1320px;
            margin: 14px auto;
            padding: 0 10px;
        }

        .page { display: none; }
        .page.active { display: block; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .card-title {
            font-size: 0.96rem;
            font-weight: 800;
            color: var(--main);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-2);
            color: var(--ink);
            font-size: 0.86rem;
        }

        .btn {
            padding: 7px 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn-main { background: var(--main); color: #fff; }
        .btn-sub { background: var(--sub); color: #fff; }
        .btn-ok { background: var(--ok); color: #fff; }
        .btn-warn { background: var(--warn); color: #fff; }
        .btn-bad { background: var(--bad); color: #fff; }
        .btn-light { background: rgba(255, 255, 255, 0.16); color: #fff; border: 1px solid rgba(255, 255, 255, 0.28); }
        .btn-ghost { background: var(--card-2); color: var(--ink); border: 1px solid var(--border); }

        .price-box {
            background: var(--card-2);
            border: 1.5px solid var(--main);
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .price-tag {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--ok);
        }

        .status-box {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 9px;
            background: var(--card-2);
            border: 1px solid var(--sub);
            color: var(--sub);
            font-size: 0.83rem;
            font-weight: 700;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 9px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            font-size: 0.84rem;
        }

        th {
            background: var(--main);
            color: #fff;
            padding: 9px 10px;
            white-space: nowrap;
        }

        td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .alpha-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 12px;
        }

        .alpha-btn {
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card-2);
            color: var(--ink);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
        }

        .alpha-btn.active {
            background: var(--main);
            color: #fff;
            border-color: var(--main);
        }

        .debtor-card {
            background: var(--card-2);
            border: 1px solid var(--border);
            border-right: 4px solid var(--warn);
            border-radius: 9px;
            padding: 11px;
            margin-bottom: 10px;
        }

        .debtor-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 6px;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .b-red { background: #fee2e2; color: #991b1b; }
        .b-green { background: #dcfce7; color: #166534; }

        .img-preview {
            margin-top: 10px;
            max-width: 340px;
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
        }

        footer {
            text-align: center;
            padding: 16px 10px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 700;
        }

        .toast {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            color: #fff;
            padding: 9px 16px;
            border-radius: 99px;
            font-size: 0.82rem;
            font-weight: 700;
            z-index: 999;
            display: none;
        }

        @media print {
            header, .no-print, .toast { display: none !important; }
            .page { display: block !important; }
        }
    </style>
</head>
<body>

<header class="no-print">
    <div class="head-top">
        <h1>💊 صيدليتي — حاسبة ومبيعات ومشتريات وديون وأرشيف قوائم</h1>
        <div style="display:flex; gap:6px;">
            <button class="btn btn-light" onclick="window.print()">🖨️ طباعة</button>
            <button class="btn btn-light" onclick="toggleTheme()">🌓 ليلي / نهاري</button>
        </div>
    </div>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="openPage('p-home', this)">1️⃣ الرئيسية (الحاسبة والبيع)</button>
        <button class="nav-btn" onclick="openPage('p-sales', this)">2️⃣ قائمة المبيعات</button>
        <button class="nav-btn" onclick="openPage('p-purchases', this)">3️⃣ قائمة المشتريات</button>
        <button class="nav-btn" onclick="openPage('p-debts', this)">4️⃣ قائمة الديون (أ - ي)</button>
        <button class="nav-btn" onclick="openPage('p-lists', this)">5️⃣ القوائم وأرشيف القوائم</button>
        <button class="nav-btn" onclick="openPage('p-style', this)">6️⃣ المظهر</button>
    </nav>
</header>

<div class="container">

    <!-- 1. الصفحة الرئيسية -->
    <div id="p-home" class="page active
